---
- name: Provision local dev environment
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Install tmux (terminal multiplexer for long-running/background sessions)
      ansible.builtin.package:
        name: tmux
        state: present

    - name: Install CodeGraph CLI/MCP server (code-structure indexing for coding agents)
      community.general.npm:
        name: "@colbymchenry/codegraph"
        global: true
        state: present
